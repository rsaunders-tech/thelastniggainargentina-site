<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Last Nigga in Argentina. Project updates coming soon.">
  <title>The Last Nigga in Argentina</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      color: #111;
      background: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0 auto;
      width: min(72rem, calc(100% - 2 * clamp(1.25rem, 5vw, 4rem)));
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    header, footer {
      padding-block: 1.25rem;
      font-size: 0.875rem;
    }

    header {
      border-bottom: 1px solid currentColor;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    main {
      display: grid;
      align-content: center;
      justify-items: start;
      padding-block: clamp(4rem, 11vw, 8rem);
    }

    .status {
      margin: 0 0 1.5rem;
      padding: 0.45rem 0.75rem;
      background: #111;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 650;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 13ch;
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(2.75rem, 8vw, 7.25rem);
      font-weight: 400;
      letter-spacing: -0.055em;
      line-height: 1.02;
      text-wrap: balance;
    }

    footer {
      border-top: 1px solid currentColor;
      color: #444;
    }
  </style>
</head>
<body>
  <header>thelastniggainargentina.com</header>
  <main>
    <p class="status">Coming soon</p>
    <h1>The Last Nigga in Argentina</h1>
  </main>
  <footer>Project updates will appear here.</footer>
</body>
</html>
